name: Extract APK
on: [push, workflow_dispatch]

jobs:
  unzip-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 解压文件并提取 APK
        run: |
          mkdir -p final_apk
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d ./final_apk
          fi
          find . -name "*.apk" -exec cp {} ./final_apk/ \;

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: My-APK-Files
          path: final_apk/
