name: Extract All Files
on: [push, workflow_dispatch]

jobs:
  unzip-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 解压所有文件
        run: |
          mkdir -p output_folder
          # 暴力解压所有的 tar.gz 和 zip 到当前目录
          if ls *.tar.gz 1> /dev/null 2>&1; then tar -zxvf *.tar.gz; fi
          if ls *.zip 1> /dev/null 2>&1; then unzip -o *.zip; fi
          # 把解压出来散落一地的所有文件（除了 .git 文件夹）全收进 output_folder
          find . -maxdepth 2 -not -path "./.git*" -not -path "./output_folder*" -exec cp -r {} ./output_folder/ \;

      - name: 上传所有解压出来的文件
        uses: actions/upload-artifact@v4
        with:
          name: All-Extracted-Files
          path: output_folder/
