name: Extract APK
on: [push, workflow_dispatch]

jobs:
  unzip-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 解压文件并提取 APK
        run: |
          mkdir -p apk_output
          # 解压 tar.gz 格式
          if ls *.tar.gz 1> /dev/null 2>&1; then
            tar -zxvf *.tar.gz
          fi
          # 解压 zip 格式 (以防万一)
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          # 寻找所有找到的 APK 文件并集中到一个文件夹
          find . -name "*.apk" -exec cp {} ./apk_output/ \;

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: My-APK-Files
          path: apk_output/
